name: Build, Publish and deploy Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/committeeclash-backend
      IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/committeeclash-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend Build & Push ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_BACKEND) || '' }}
            ${{ github.ref == 'refs/heads/development' && format('{0}:dev', env.IMAGE_BACKEND) || '' }}

      # --- Frontend Build & Push ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_FRONTEND) || '' }}
            ${{ github.ref == 'refs/heads/development' && format('{0}:dev', env.IMAGE_FRONTEND) || '' }}

      # --- Trigger AAS deploy ---
      - name: Trigger AAS deploy
        uses: distributhor/workflow-webhook@v2.0.2
        env:
          webhook_url: ${{ secrets.AAS_COMMITTEECLASH_WEBHOOK_URL || secrets.WEBHOOK_URL || vars.AAS_COMMITTEECLASH_WEBHOOK_URL || vars.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.AAS_COMMITTEECLASH_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET || vars.AAS_COMMITTEECLASH_WEBHOOK_SECRET || vars.WEBHOOK_SECRET }}
